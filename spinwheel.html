<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win</title>
    <style>
 /* General Styles */
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: white;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    /* box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2); */
    width: 90%;
    max-width: 500px;
}

/* Title */
h1 {
    color: #222;
}

/* Wheel Canvas */
.wheel-container {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    margin: 20px 0;
    width: 100%;
    max-width: 400px;
}

/* Pointer Indicator */
.pointer {
    position: absolute;
    top: 10px;
    width: 30px;
    height: 30px;
    background: red;
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
}

/* Spin Button */
button {
    background: black;
    color: green;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 0px 5px;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    background: #333;
}

/* Result Text */
#result {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
    color: #222;
}
/* Receipt Modal */
.receipt-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.3);
    width: 80%;
    max-width: 400px;
    z-index: 1000; /* Ensure the receipt is above the wheel */
    text-align: center;
    display: none;
}

.receipt-popup h2 {
    color: #222;
}

.receipt-popup p {
    font-size: 1.2em;
    color: #333;
}

.receipt-popup button {
    background: black;
    color: gold;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
}

.receipt-popup button:hover {
    background: #333;
}


    </style>
</head>
<body>
    <div class="container">
        <h1>Spin & Win</h1>
        <canvas id="wheel" width="600" height="600"></canvas>
        <button id="spin-btn">Spin</button>
        <p id="result"></p>
        <!-- Receipt Modal -->
        <div id="receipt" class="receipt-popup">
            <h2>🎉 Prize Receipt 🎉</h2>
            <p><strong>Mobile Number:</strong> <span id="receiptMobile"></span></p>
            <p><strong>Reference Number:</strong> <span id="referenceNumber"></span></p>
            <p><strong>Prize:</strong> <span id="receiptPrize"></span></p>
            <p>📩 To claim your prize, please send a text to this number +1 812-925-2418 immediately</p>
            <p>💾 Keep this receipt saved as proof for claiming.</p>
            <button onclick="closeReceipt()">Close</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
